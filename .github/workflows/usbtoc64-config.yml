name: USBtoC64 Config Tool

on:
  push:
    paths:
      - "tools/usbtoc64-config/**"
      - "USBtoC64/**"
    tags:
      - "config-tool-v*"
  workflow_dispatch:

permissions:
  contents: read

# --- Firmware build settings -------------------------------------------------------------
# Same as the Arduino IDE build used for testing (verbose compile output, 15/11/2026):
# core 3.3.7, board Waveshare ESP32-S3-Zero, ArduinoJson 7.4.3, Adafruit NeoPixel 1.15.4,
# ESP32_USB_Host_HID from its GitHub main branch.
env:
  ESP32_CORE: "esp32:esp32@3.3.7"
  ESP32_INDEX: "https://espressif.github.io/arduino-esp32/package_esp32_index.json"
  FQBN: "esp32:esp32:waveshare_esp32_s3_zero:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=default,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none"
  LIB_ARDUINOJSON: "ArduinoJson@7.4.3"
  LIB_NEOPIXEL: "Adafruit NeoPixel@1.15.4"
  LIB_USB_HOST_HID: "https://github.com/esp32beans/ESP32_USB_Host_HID.git"
  ESPTOOL_VERSION: "v4.8.1"

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install core and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$ESP32_INDEX"
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install "$ESP32_CORE"
          arduino-cli lib install "$LIB_ARDUINOJSON" "$LIB_NEOPIXEL"
          arduino-cli lib install --git-url "$LIB_USB_HOST_HID"

      - name: Compile firmware
        run: |
          BUILD_ID=$(git rev-parse --short=7 HEAD)
          VERSION=$(grep -oP '#define FW_VERSION "\K[^"]+' USBtoC64/USBtoC64_Adv.ino)
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
          echo "FW_VERSION=$VERSION" >> "$GITHUB_ENV"
          # arduino-cli wants the folder named like the main .ino
          mkdir -p sketch/USBtoC64_Adv
          cp USBtoC64/*.ino USBtoC64/*.h sketch/USBtoC64_Adv/
          # build_opt.h is passed to the compiler by the esp32 core (@build_opt.h): sets FW_BUILD
          printf -- '-DFW_BUILD=\\"%s\\"\n' "$BUILD_ID" > sketch/USBtoC64_Adv/build_opt.h
          cat sketch/USBtoC64_Adv/build_opt.h
          arduino-cli compile --fqbn "$FQBN" --output-dir out sketch/USBtoC64_Adv
          ls -la out
          strings out/*.ino.bin | grep -E "DB9 ADAPTER v" || true

      - name: Firmware image and manifest
        run: |
          MERGED=$(ls out/*.merged.bin | head -1)
          mkdir -p fw
          cp "$MERGED" fw/USBtoC64_Adv.bin
          SHA=$(sha256sum fw/USBtoC64_Adv.bin | cut -d' ' -f1)
          printf '{"version":"%s","build":"%s","file":"USBtoC64_Adv.bin","sha256":"%s","address":"0x0","chip":"esp32s3"}\n' \
            "$FW_VERSION" "$BUILD_ID" "$SHA" > fw/firmware.json
          cat fw/firmware.json

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: fw/
          if-no-files-found: error

  build:
    needs: firmware
    # The tool is built even if the firmware does not compile (the zip then has no firmware).
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/usbtoc64-config
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test (Core)
        run: dotnet test tests/UsbToC64.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish CLI (win-x64, single file)
        run: >
          dotnet publish src/UsbToC64.Cli -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - name: Publish GUI (win-x64, single file)
        run: >
          dotnet publish src/UsbToC64.App -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - name: Firmware (if built)
        if: ${{ needs.firmware.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: tools/usbtoc64-config/publish

      - name: esptool.exe
        shell: pwsh
        run: |
          $zip = "esptool.zip"
          Invoke-WebRequest "https://github.com/espressif/esptool/releases/download/$env:ESPTOOL_VERSION/esptool-$env:ESPTOOL_VERSION-win64.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath esptool-x
          $exe = Get-ChildItem esptool-x -Recurse -Filter esptool.exe | Select-Object -First 1
          Copy-Item $exe.FullName publish/esptool.exe

      - uses: actions/upload-artifact@v4
        with:
          name: usbtoc64-config-win-x64
          path: |
            tools/usbtoc64-config/publish/USBtoC64Config.exe
            tools/usbtoc64-config/publish/usbtoc64.exe
            tools/usbtoc64-config/publish/esptool.exe
            tools/usbtoc64-config/publish/USBtoC64_Adv.bin
            tools/usbtoc64-config/publish/firmware.json
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/config-tool-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usbtoc64-config-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            USBtoC64Config.exe
            usbtoc64.exe
            esptool.exe
            USBtoC64_Adv.bin
            firmware.json
