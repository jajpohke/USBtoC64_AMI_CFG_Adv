name: USBtoC64 Config Tool

on:
  push:
    paths:
      - "tools/usbtoc64-config/**"
    tags:
      - "config-tool-v*"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: tools/usbtoc64-config

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test (Core)
        run: dotnet test tests/UsbToC64.Core.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish CLI (win-x64, single file)
        run: >
          dotnet publish src/UsbToC64.Cli -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: usbtoc64-config-win-x64
          path: tools/usbtoc64-config/publish/usbtoc64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/config-tool-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: usbtoc64-config-win-x64
      - uses: softprops/action-gh-release@v2
        with:
          files: usbtoc64.exe
